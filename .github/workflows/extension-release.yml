name: Extension Release

# Manual release only: the extension ships on its own cadence and must NEVER build or
# release on a master push (frontend/backend changes are independent). Triggered either
# manually via the "Run workflow" button or by pushing an ext-v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'ext-v*'

jobs:
  build-and-release:
    name: Build & Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@flyt/extension..."

      - name: Build extension
        run: pnpm --filter "@flyt/extension" build

      - name: Zip extension
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="dev-${GITHUB_SHA::7}"
          fi
          (cd extension/dist && zip -r "../flytlese-${TAG}.zip" .)
          echo "ASSET=extension/flytlese-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/ext-v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: flytlese-zip
          path: extension/flytlese-*.zip
