[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "flyt"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "sqlalchemy>=2.0.45",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.18.1",
  "fsrs>=6.3.0",
  "python-dotenv>=1.2.1",
  "pydantic-settings>=2.0.0",
  "jsonschema>=4.23.0",
  "email-validator>=2.3.0",
  "PyJWT>=2.13.0",
  "authlib>=1.3.0",
  "itsdangerous>=2.1.0",
  "python-multipart>=0.0.9",
  "ipython>=9.9.0",
  "starlette-admin>=0.16.0",
  "spacy>=3.7.0",
  "setuptools>=83.0.0",
  "nb_core_news_md",
  "python-frontmatter>=1.1.0",
  "httpx>=0.27.0",
  "arq>=0.26.0",
  "asgi-correlation-id>=1.4.0",
  "python-json-logger>=4.0.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "sentry-sdk[fastapi]>=2.0.0",
  "cryptography>=49.0.0",
  "aiocache[redis]>=0.12.3",
  "limits>=5.8.0",
  "redis>=5.3.1",
]

[tool.uv.sources]
# Not on PyPI; wheel must match the resolved spaCy 3.8.x. Bump alongside spaCy.
nb_core_news_md = { url = "https://github.com/explosion/spacy-models/releases/download/nb_core_news_md-3.8.0/nb_core_news_md-3.8.0-py3-none-any.whl" }

[tool.hatch.version]
path = "version.py"

[tool.hatch.build]
exclude = ["norsk.egg-info/**"]

[tool.hatch.build.targets.wheel]
packages = ["flyt"]

[tool.semantic_release]
assets = []
build_command_env = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = false
no_git_verify = false
tag_format = "v{version}"
add_partial_tags = false
version_variable = ["version.py:__version__"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = ""
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "style",
  "refactor",
  "test",
]
allowed_tags = [
  "feat",
  "fix",
  "perf",
  "build",
  "chore",
  "ci",
  "docs",
  "style",
  "refactor",
  "test",
]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.ruff.lint]
preview = true
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "S",
  "ASYNC",
  "DTZ",
  "FAST",
  "PERF",
  "RET",
  "RUF",
  "UP",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0914",
  "PLR0915",
  "PLR0916",
  "PLR1702",
  "PLR2004",
]
ignore = ["RUF105", "RUF201"]
[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "F401"]
"alembic/versions/*.py" = ["PLR0915", "UP"]
"flyt/core/config.py" = ["S105"]
"flyt/core/db.py" = ["ASYNC119"]
"flyt/apps/users/deps.py" = ["RUF029"]
"scripts/dev_seed_reading.py" = ["RUF001"]
"tests/**/*.py" = ["DTZ001", "PLR0914", "RUF029", "S101"]
"tests/integration/users/test_account_deletion.py" = ["S106"]
"tests/scripts/test_ordbokene_importer_pronunciation.py" = ["RUF001"]
"tests/unit/test_config.py" = ["S106"]
"tests/unit/test_story_generation_config.py" = ["S106"]
"tests/unit/test_user_service.py" = ["S106"]
"tests/unit/test_worker_bootstrap.py" = ["S404"]

[tool.ruff.lint.pylint]
max-args = 9

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true
enable_error_code = ["unused-awaitable"]
files = ["flyt", "scripts"]

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "ruff==0.16.6",
  "pytest>=8.0.0",
  "pytest-anyio>=0.0.0",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
  "pytest-faker>=2.0.0",
  "faker>=22.0.0",
  "httpx>=0.28.0",
  "pre-commit>=3.7.0",
  "mypy>=1.11.2",
  "polyfactory>=3.3.0",
  "xlrd>=2.0.2",
]
