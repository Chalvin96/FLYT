[project]
name = "flyt-stt-service"
version = "0.1.0"
description = "Internal CPU Norwegian speech-to-text service for Flyt"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.0,<1.0.0",
  "faster-whisper>=1.2.1,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "uvicorn[standard]>=0.40.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.0.0,<10.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
